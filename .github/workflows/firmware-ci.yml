name: Firmware CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Unit tests (PC)
        run: pio test -e native
      - name: Python tool tests
        run: python -m unittest discover -s tools -v
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Web unit tests
        run: node --test "web-tests/*.test.mjs"
      - name: Build the firmware (ESP32-C6 board)
        run: pio run -e esp32-c6
      - name: Build the firmware (ESP32-S3 board)
        run: pio run -e esp32-s3
      # The merged image for the ESP32-S3 board, written at 0x0 with any
      # esptool-based flasher (the Monitor-Buddy web flasher does not know
      # this board yet). Download it from the run's Artifacts.
      - uses: actions/upload-artifact@v7
        with:
          name: monitor-buddy-esp32-s3-factory
          path: .pio/build/esp32-s3/firmware.factory.bin
          if-no-files-found: error
